<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect VividMedi extension</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f3f8fb; color: #132c3d; }
    main { width: min(520px, calc(100% - 40px)); padding: 32px; border: 1px solid #c9dce8; border-radius: 16px; background: #fff; box-shadow: 0 18px 50px rgba(20, 69, 99, .12); }
    .eyebrow { margin: 0 0 8px; color: #0875aa; font-size: 12px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 0 0 12px; font-size: 25px; }
    p { margin: 0; line-height: 1.55; }
    #status { margin-top: 18px; padding: 12px 14px; border-radius: 10px; background: #edf7fc; }
    #status.error { color: #8f1422; background: #fff0f1; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">VividMedi secure connection</p>
    <h1>Connecting the MediRecords extension</h1>
    <p>This page sends a time-limited credential directly to your installed extension. The master server token is never disclosed.</p>
    <p id="status" role="status" aria-live="polite">Connecting…</p>
  </main>
  <script>
    (() => {
      const extensionId = {{ extension_id|tojson }};
      const credential = {{ pair_token|tojson }};
      const status = document.getElementById("status");
      const fail = (message) => {
        status.textContent = message;
        status.classList.add("error");
      };

      if (!window.chrome?.runtime?.sendMessage) {
        fail("Chrome could not contact the extension. Reload it on chrome://extensions, then click Connect with VividMedi again.");
        return;
      }

      chrome.runtime.sendMessage(extensionId, {
        type: "VIVIDMEDI_STATE_PAIR_TOKEN_V1",
        token: credential,
        endpoint: `${window.location.origin}/api/medirecords-sync`
      }, (response) => {
        const error = chrome.runtime.lastError?.message;
        if (error || !response?.ok) {
          fail(error || response?.error || "The extension did not accept the secure connection.");
          return;
        }
        status.textContent = "Connected. Return to the extension and start the sync.";
        window.setTimeout(() => window.close(), 1400);
      });
    })();
  </script>
</body>
</html>
